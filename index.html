<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои приложения</title>
<style>
  :root {
    --bg-color: #1e1e2f;
    --bg-gradient: linear-gradient(135deg, #1e1e2f, #2d2b55);
    --card-bg: rgba(255, 255, 255, 0.08);
    --card-bg-hover: rgba(255, 255, 255, 0.15);
    --card-border: rgba(255, 255, 255, 0.15);
    --text-color: #ffffff;
    --muted-color: #b2bec3;
    --btn-update-bg: #3498db;
    --btn-theme-bg: #f39c12;
    --badge-bg: #e67e22;
  }

  [data-theme="light"] {
    --bg-color: #f0f2f5;
    --bg-gradient: linear-gradient(135deg, #f0f2f5, #dfe9f3);
    --card-bg: #ffffff;
    --card-bg-hover: #f6f8fc;
    --card-border: #dfe1e5;
    --text-color: #333333;
    --muted-color: #6c757d;
    --btn-update-bg: #3498db;
    --btn-theme-bg: #d35400;
    --badge-bg: #e67e22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 15px;
    transition: background 0.3s, color 0.3s;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    color: #fff;
    font-weight: 500;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
  .btn:active { transform: translateY(0); }
  .btn-update { background-color: var(--btn-update-bg); }
  .btn-theme  { background-color: var(--btn-theme-bg); }
  .btn:disabled { opacity: 0.6; cursor: wait; }

  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 1000px;
  }

  .app-card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 25px 15px;
    text-align: center;
    cursor: grab;
    transition: background-color 0.2s, transform 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .app-card:hover { background-color: var(--card-bg-hover); transform: translateY(-5px); }
  .app-card:active { cursor: grabbing; transform: scale(1.02); }
  .app-card.dragging {
    opacity: 0.5;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  }
  .app-card .icon { font-size: 40px; line-height: 1; }
  .app-card .name { font-size: 17px; font-weight: 600; word-break: break-word; }

  .badge-updated {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--badge-bg);
    color: #fff;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 8px;
    display: none;
  }

  .status {
    margin-top: 30px;
    font-size: 14px;
    color: var(--muted-color);
    min-height: 24px;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button class="btn btn-update" id="btnUpdate" onclick="checkUpdates()">🔄 Проверить обновления</button>
    <button class="btn btn-theme" onclick="toggleTheme()">☀️ Переключить тему</button>
  </div>

  <div class="apps" id="apps"></div>

  <div class="status" id="updateStatus"></div>

<script>
  const GITHUB_USER = 'ii4012899-a11y';
  const STORAGE_APPS_KEY  = 'myWebApps_github';
  const STORAGE_THEME_KEY = 'userThemePref';
  const STORAGE_LAST_CHECK_KEY = 'lastUpdateCheckISO';
  const CACHE_TTL_MS = 10 * 60 * 1000; // 10 минут

  // Репозитории, которые не нужно показывать (помимо самой витрины).
  // Имя репозитория — строчными буквами.
  const EXCLUDE_REPOS = [];

  // --- Автоопределение самой витрины, чтобы она не попадала в список ---
  function detectCurrentRepo() {
    const host = location.hostname; // например: ii4012899-a11y.github.io
    if (host.endsWith('.github.io')) {
      const parts = location.pathname.split('/').filter(Boolean);
      // для репозиторных Pages первый сегмент пути — имя репозитория
      return parts.length ? parts[0].toLowerCase() : null;
    }
    // для user-pages (host === user.github.io) репозиторий обычно username/username.github.io
    if (host.endsWith('.github.io')) return host.replace(/\.github\.io$/, '').toLowerCase();
    return null;
  }
  const CURRENT_REPO = detectCurrentRepo();

  function isExcluded(repoName) {
    const name = repoName.toLowerCase();
    if (name === CURRENT_REPO) return true;
    return EXCLUDE_REPOS.includes(name);
  }

  // --- Запасной список, если GitHub недоступен ---
  const fallbackApps = [
    { id: 'Razvorot', name: 'Разворачиватель адресов', url: 'https://ii4012899-a11y.github.io/Razvorot/', icon: '🗺️' }
  ];

  // --- Тема ---
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const newTheme = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem(STORAGE_THEME_KEY, newTheme);
    updateThemeButton();
  }
  function updateThemeButton() {
    const theme = document.documentElement.getAttribute('data-theme');
    document.querySelector('.btn-theme').textContent =
      theme === 'light' ? '🌙 Тёмная тема' : '☀️ Светлая тема';
  }
  const savedTheme = localStorage.getItem(STORAGE_THEME_KEY);
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  updateThemeButton();

  // --- Загрузка списка с GitHub ---
  function buildUrl(repo) {
    return 'https://' + GITHUB_USER + '.github.io/' + repo.name + '/';
  }

  function repoToApp(repo) {
    const desc = (repo.description || '').trim();
    let icon = '🌐';
    let name = repo.name;
    if (desc) {
      // первый символ описания — эмодзи? Тогда это иконка
      const first = Array.from(desc)[0];
      if (first && /\p{Extended_Pictographic}/u.test(first)) {
        icon = first;
        name = desc.slice(first.length).trim() || repo.name;
      } else {
        name = desc;
      }
    }
    return { id: repo.name, name, url: buildUrl(repo), icon, pushed_at: repo.pushed_at };
  }

  async function loadAppsFromGitHub() {
    const response = await fetch(
      'https://api.github.com/users/' + GITHUB_USER + '/repos?per_page=100&sort=updated&_=' + Date.now()
    );
    if (!response.ok) throw new Error('GitHub API: ' + response.status);
    const repos = await response.json();
    return repos
      .filter(repo => repo.has_pages && !isExcluded(repo.name))
      .map(repoToApp);
  }

  // --- Кэш и фоллбэк ---
  function readCache() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_APPS_KEY) || 'null');
      if (raw && raw.apps && Date.now() - raw.time < CACHE_TTL_MS) return raw.apps;
      return null; // просрочен или пусто
    } catch { return null; }
  }
  function writeCache(apps) {
    localStorage.setItem(STORAGE_APPS_KEY, JSON.stringify({ time: Date.now(), apps }));
  }

  async function loadApps() {
    const cached = readCache();
    if (cached) return cached;
    try {
      const apps = await loadAppsFromGitHub();
      writeCache(apps);
      return apps;
    } catch (e) {
      console.warn('GitHub недоступен, показываю запасной список:', e);
      const stale = (() => {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_APPS_KEY) || 'null');
          return raw && raw.apps ? raw.apps : null;
        } catch { return null; }
      })();
      return stale || fallbackApps;
    }
  }

  // --- Рендер и Drag-and-Drop ---
  let apps = [];

  function renderApps() {
    const container = document.getElementById('apps');
    container.innerHTML = '';
    apps.forEach((app, index) => {
      const card = document.createElement('div');
      card.className = 'app-card';
      card.draggable = true;
      card.dataset.index = index;
      card.dataset.id = app.id;
      card.innerHTML =
        '<div class="badge-updated">обновлено</div>' +
        '<div class="icon">' + (app.icon || '🌐') + '</div>' +
        '<div class="name"></div>';
      card.querySelector('.name').textContent = app.name;

      card.addEventListener('click', () => window.open(app.url, '_blank'));
      addDragEvents(card);
      container.appendChild(card);
    });
  }

  function addDragEvents(card) {
    let dragStartIndex;
    card.addEventListener('dragstart', () => {
      card.classList.add('dragging');
      dragStartIndex = +card.dataset.index;
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      persistOrder();
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      const currentIndex = +card.dataset.index;
      if (currentIndex === dragStartIndex) return;
      const cards = document.querySelectorAll('.app-card');
      const dragging = document.querySelector('.app-card.dragging');
      if (!dragging) return;
      if (currentIndex < dragStartIndex) {
        card.parentNode.insertBefore(dragging, card);
      } else {
        card.parentNode.insertBefore(dragging, card.nextSibling);
      }
      updateIndexes();
      dragStartIndex = +dragging.dataset.index;
    });
  }

  function updateIndexes() {
    document.querySelectorAll('.app-card').forEach((card, i) => {
      card.dataset.index = i;
    });
  }

  function persistOrder() {
    const orderIds = Array.from(document.querySelectorAll('.app-card')).map(c => c.dataset.id);
    apps.sort((a, b) => orderIds.indexOf(a.id) - orderIds.indexOf(b.id));
    writeCache(apps);
  }

  // --- Проверка обновлений ---
  async function checkUpdates() {
    const btn = document.getElementById('btnUpdate');
    const statusEl = document.getElementById('updateStatus');
    btn.disabled = true;
    statusEl.textContent = '⏳ Проверяю обновления...';
    try {
      const fresh = await loadAppsFromGitHub();
      writeCache(fresh);

      const lastISO = localStorage.getItem(STORAGE_LAST_CHECK_KEY);
      const lastTime = lastISO ? new Date(lastISO).getTime() : 0;

      let updated = 0;
      fresh.forEach(app => {
        if (app.pushed_at && new Date(app.pushed_at).getTime() > lastTime) updated++;
      });

      // отметить карточки
      fresh.forEach(app => {
        const card = document.querySelector('.app-card[data-id="' + CSS.escape(app.id) + '"]');
        if (!card) return;
        const isUpdated = app.pushed_at && new Date(app.pushed_at).getTime() > lastTime;
        card.querySelector('.badge-updated').style.display = isUpdated ? 'block' : 'none';
      });

      apps = mergeWithOrder(fresh);
      renderApps();

      const now = new Date().toLocaleString('ru-RU');
      localStorage.setItem(STORAGE_LAST_CHECK_KEY, new Date().toISOString());
      statusEl.textContent = updated
        ? '🔔 Найдено обновлённых приложений: ' + updated + '. Проверено: ' + now
        : '✅ Все приложения актуальны. Проверено: ' + now;
    } catch (e) {
      statusEl.textContent = '⚠️ Не удалось связаться с GitHub. Показан сохранённый список.';
    }
    btn.disabled = false;
  }

  // Обновляем данные из GitHub, но сохраняем порядок пользователя
  function mergeWithOrder(fresh) {
    const order = apps.map(a => a.id);
    const sorted = fresh.slice().sort((a, b) => {
      const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
      return (ia === -1 ? Infinity : ia) - (ib === -1 ? Infinity : ib);
    });
    return sorted;
  }

  // --- Запуск ---
  (async function init() {
    apps = await loadApps();
    renderApps();

    const lastISO = localStorage.getItem(STORAGE_LAST_CHECK_KEY);
    if (lastISO) {
      document.getElementById('updateStatus').textContent =
        'Последняя проверка обновлений: ' + new Date(lastISO).toLocaleString('ru-RU');
    }
  })();
</script>

</body>
</html>
