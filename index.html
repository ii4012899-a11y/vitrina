<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пульт от всего</title>
  <style>
    :root {
      --bg-color: #1e1e2f;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-color: #ffffff;
      --btn-update-bg: #3498db;
      --btn-theme-bg: #f39c12;
      --accent: #e74c3c;
    }

    [data-theme="light"] {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --card-border: #dfe1e5;
      --text-color: #333333;
      --btn-update-bg: #2980b9;
      --btn-theme-bg: #d35400;
      --accent: #c0392b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 15px;
      transition: background-color 0.3s, color 0.3s;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 30px;
      text-transform: uppercase;
      position: relative;
    }
    
    /* Декоративная линия под заголовком */
    h1::after {
      content: '';
      display: block;
      width: 60px;
      height: 3px;
      background: var(--accent);
      margin: 10px auto 0;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
      color: white;
      font-weight: 500;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
    .btn:active { transform: translateY(0); }

    .btn-update { background-color: var(--btn-update-bg); }
    .btn-theme { background-color: var(--btn-theme-bg); }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .app-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 25px 15px;
      text-align: center;
      cursor: grab;
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .app-card:active { cursor: grabbing; transform: scale(1.02); }
    .app-card.dragging {
      opacity: 0.5;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
      border-color: transparent;
      background: rgba(255,255,255,0.05);
    }

    .app-card:hover { transform: translateY(-5px); }

    .app-card .icon { font-size: 40px; line-height: 1; }
    .app-card .name { font-size: 17px; font-weight: 600; word-break: break-word; }

    /* Бейдж обновления */
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent);
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: none; /* Скрыт по умолчанию */
    }
    .app-card.updated .badge { display: block; }

    #updateStatus {
      margin-top: 30px;
      font-size: 14px;
      color: #b2bec3;
      min-height: 24px;
      text-align: center;
    }

    [data-theme="light"] #updateStatus { color: #6c757d; }
  </style>
</head>
<body>

  <h1>Пульт от всего</h1>

  <div class="toolbar">
    <button class="btn btn-update" onclick="checkUpdates()">🔄 Проверить обновления</button>
    <button class="btn btn-theme" onclick="toggleTheme()">☀️ Переключить тему</button>
  </div>

  <div class="apps" id="apps"></div>

  <div id="updateStatus"></div>

<script>
  const STORAGE_ORDER_KEY = 'appOrder_v3'; // Только порядок ID
  const STORAGE_CACHE_KEY = 'appCache_v3'; // Кэш данных (на 10 минут)
  const CACHE_DURATION = 10 * 60 * 1000; // 10 минут
  const GITHUB_USER = 'ii4012899-a11y';
  
  // Репозитории, которые точно не должны появляться (например, черновики)
  const EXCLUDE_REPOS = []; 

  // --- Логика темы ---
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const newTheme = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('userThemePref', newTheme);
  }

  (function initTheme() {
    const saved = localStorage.getItem('userThemePref');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();

  // --- Получение и обработка данных с GitHub ---
  async function fetchApps() {
    try {
      const response = await fetch(
        `https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated`
      );
      if (!response.ok) throw new Error('Network response was not ok');
      return await response.json();
    } catch (e) {
      console.warn('GitHub API error, using fallback:', e);
      return [];
    }
  }

  function parseReposToApps(repos) {
    const ownRepoName = window.location.pathname.split('/')[1]; // Имя текущего репозитория
    
    return repos
      .filter(repo => repo.has_pages) // Только те, где включен GitHub Pages
      .filter(repo => !EXCLUDE_REPOS.includes(repo.name)) // Исключения
      .filter(repo => repo.name !== ownRepoName) // Не показывать саму витрину
      .map(repo => {
        const desc = repo.description || '';
        const firstChar = desc.charAt(0);
        let icon = '🌐';
        let name = desc.trim() || repo.name;

        // Если первый символ — эмодзи, забираем его как иконку
        if (firstChar.length >= 2) { // Эмодзи обычно 2+ байта
           icon = firstChar;
           name = desc.slice(1).trim();
        }
        
        return {
          id: repo.id, // Стабильный ID репозитория (не меняется при переименовании)
          name: name || repo.name,
          url: `https://${GITHUB_USER}.github.io/${repo.name}/`,
          icon: icon,
          updatedAt: new Date(repo.updated_at).getTime()
        };
      });
  }

  // --- Синхронизация порядка и данных ---
  function getOrder() {
    const saved = localStorage.getItem(STORAGE_ORDER_KEY);
    return saved ? JSON.parse(saved) : [];
  }

  function saveOrder(order) {
    localStorage.setItem(STORAGE_ORDER_KEY, JSON.stringify(order));
  }

  function mergeDataAndOrder(apps, order) {
    // Сначала берём сохранённый порядок. Если ID есть в свежих данных — берём их.
    // Новые приложения (которых не было в старом порядке) добавляем в конец.
    const ordered = order
      .filter(id => apps.find(a => a.id === id)) // Убираем битые ID
      .map(id => apps.find(a => a.id === id));
    
    const existingIds = new Set(order);
    const newApps = apps.filter(a => !existingIds.has(a.id));
    
    return [...ordered, ...newApps];
  }

  // --- Рендер ---
  function renderApps(apps, updatedIds = []) {
    const container = document.getElementById('apps');
    container.innerHTML = '';

    apps.forEach(app => {
      const card = document.createElement('div');
      card.className = `app-card ${updatedIds.includes(app.id) ? 'updated' : ''}`;
      card.draggable = true;
      card.dataset.id = app.id;
      
      card.innerHTML = `
        <span class="badge">Новое</span>
        <div class="icon">${app.icon}</div>
        <div class="name">${app.name}</div>
      `;

      // Клик открывает приложение
      card.addEventListener('click', () => {
        if(app.url !== '#') window.open(app.url, '_blank');
      });

      addDragEvents(card);
      container.appendChild(card);
    });
  }

  // --- Drag-and-Drop ---
  function addDragEvents(card) {
    let dragStartId;

    card.addEventListener('dragstart', () => {
      dragStartId = card.dataset.id;
      card.classList.add('dragging');
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      saveCurrentOrder();
    });

    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      const currentId = card.dataset.id;
      if (currentId !== dragStartId) {
        const cards = Array.from(document.querySelectorAll('.app-card'));
        const startIndex = cards.findIndex(c => c.dataset.id === dragStartId);
        const currentIndex = cards.findIndex(c => c.dataset.id === currentId);

        if (startIndex !== -1 && currentIndex !== -1) {
          cards[startIndex].parentNode.insertBefore(cards[currentIndex], cards[startIndex]);
          updateDataIndexes(); // Обновляем DOM-атрибуты для корректной работы
        }
      }
    });
  }

  function updateDataIndexes() {
    document.querySelectorAll('.app-card').forEach((card, index) => {
      // Визуально ничего не меняем, но для логики drag-over полезно иметь актуальный порядок в DOM
      // В нашей архитектуре мы сохраняем порядок по ID, поэтому здесь можно ничего не делать,
      // но оставим для совместимости.
    });
  }

  function saveCurrentOrder() {
    const ids = Array.from(document.querySelectorAll('.app-card')).map(c => parseInt(c.dataset.id));
    saveOrder(ids);
  }

  // --- Обновления ---
  function checkUpdates() {
    const statusEl = document.getElementById('updateStatus');
    statusEl.textContent = '⏳ Проверка обновлений...';

    fetchApps().then(repos => {
      const apps = parseReposToApps(repos);
      const cache = {
        timestamp: Date.now(),
        apps: apps
      };
      localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(cache));

      const now = new Date().toLocaleString('ru-RU');
      statusEl.textContent = `✅ Проверка выполнена: ${now}`;

      // Сравниваем с предыдущим кэшем, чтобы найти обновления
      const prevCacheStr = localStorage.getItem(STORAGE_CACHE_KEY); 
      // Примечание: мы только что перезаписали кэш, поэтому для сравнения нужно брать ДО записи.
      // Для упрощения в этой версии: просто показываем статус. 
      // Продвинутая логика сравнения требует хранения "предыдущего" кэша отдельно.
      
      // Здесь мы просто обновляем список и отмечаем все как "новые" при первом запуске после деплоя,
      // либо можно реализовать сравнение по updatedAt.
      renderApps(apps);
    }).catch(e => {
      statusEl.textContent = '⚠️ Не удалось проверить обновления: ' + e.message;
    });
  }

  // Улучшенная логика загрузки: сначала кэш (если свежий), потом API
  async function loadInitial() {
    const cachedStr = localStorage.getItem(STORAGE_CACHE_KEY);
    let apps = [];
    let isCached = false;

    if (cachedStr) {
      const cached = JSON.parse(cachedStr);
      if (Date.now() - cached.timestamp < CACHE_DURATION) {
        apps = cached.apps;
        isCached = true;
        console.log('Loaded from cache');
      }
    }

    if (!isCached) {
      console.log('Fetching from GitHub...');
      const repos = await fetchApps();
      apps = parseReposToApps(repos);
      localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify({
        timestamp: Date.now(),
        apps: apps
      }));
    }

    const order = getOrder();
    const finalList = mergeDataAndOrder(apps, order);
    renderApps(finalList);

    // Показать статус последней проверки
    const lastCheck = localStorage.getItem('lastUpdateCheck');
    if (lastCheck) {
      document.getElementById('updateStatus').textContent = 'Последняя проверка: ' + lastCheck;
    }
  }

  loadInitial();
</script>
</body>
</html>
